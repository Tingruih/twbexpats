name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *" # 11:17 AM (UTC+8)
    - cron: "17 6 * * *" # 2:17 PM (UTC+8)
  workflow_dispatch:
    inputs:
      update_constants:
        description: "Re-fetch past-season league constants (FIP/lgERA team totals, tjstats.ca wRC+ constants)"
        type: boolean
        default: false
      full_history:
        description: "Re-fetch every past season of per-player data (game logs, retired players, sabermetrics, expected stats)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
  GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
  GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
  GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 網址唯一來源：GitHub Pages 設定。設了自訂網域後 base_url 會變成
      # https://<domain>、base_path 變成空字串，build 不用改任何程式碼。
      # 見 docs/custom_domain.md
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Restore DB from Google Drive
        run: |
          mkdir -p data
          TOKEN_JSON="$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d client_id="$GDRIVE_CLIENT_ID" \
            -d client_secret="$GDRIVE_CLIENT_SECRET" \
            -d refresh_token="$GDRIVE_REFRESH_TOKEN" \
            -d grant_type=refresh_token)"
          ACCESS_TOKEN="$(echo "$TOKEN_JSON" | jq -r '.access_token')"
          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
            echo "Failed to get access token; HTTP error in token exchange"
            exit 1
          fi

          curl -fL \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://www.googleapis.com/drive/v3/files/$GDRIVE_FILE_ID?alt=media" \
            -o data/tracker.sqlite3

          ls -lh data/tracker.sqlite3

      - name: Refresh & Build
        env:
          UPDATE_CONSTANTS: ${{ github.event.inputs.update_constants }}
          FULL_HISTORY: ${{ github.event.inputs.full_history }}
          PAGES_SITE_URL: ${{ steps.pages.outputs.base_url }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          # configure-pages 沒回網址時直接失敗，避免 canonical/sitemap 寫成相對路徑
          : "${PAGES_SITE_URL:?actions/configure-pages did not return base_url}"
          EXTRA_ARGS=()
          if [ "$UPDATE_CONSTANTS" = "true" ]; then
            EXTRA_ARGS+=(--update-constants)
          fi
          if [ "$FULL_HISTORY" = "true" ]; then
            EXTRA_ARGS+=(--full-history)
          fi
          python build.py refresh \
            --site-url "$PAGES_SITE_URL/" \
            --base-url "$PAGES_BASE_PATH/" \
            "${EXTRA_ARGS[@]}"

      - name: Upload DB to Google Drive
        if: success()
        run: |
          TOKEN_JSON="$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d client_id="$GDRIVE_CLIENT_ID" \
            -d client_secret="$GDRIVE_CLIENT_SECRET" \
            -d refresh_token="$GDRIVE_REFRESH_TOKEN" \
            -d grant_type=refresh_token)"
          ACCESS_TOKEN="$(echo "$TOKEN_JSON" | jq -r '.access_token')"
          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
            echo "Failed to get access token; HTTP error in token exchange"
            exit 1
          fi

          curl -fL -X PATCH \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @data/tracker.sqlite3 \
            "https://www.googleapis.com/upload/drive/v3/files/$GDRIVE_FILE_ID?uploadType=media"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
